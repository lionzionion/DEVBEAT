name: Testar e publicar DEVBEAT Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testes de catálogo
        run: npm test
      - name: Verificar sintaxe
        run: npm run check
      - name: Preparar site estático
        run: |
          mkdir -p _site
          cp index.html styles.css app.js catalog.mjs queue.mjs identity.mjs config.mjs manifest.webmanifest _site/
          touch _site/.nojekyll
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar artefato de publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar no GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
